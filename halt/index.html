<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Halt</title>
    <style>
        html,
        body,
        canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex='1'></canvas>
    <script src="gl.js"></script>
    <script src="sapp_jsutils.js"></script>
    <script>
        var worker;
        var computer_move = null;

        if (window.Worker) {
            worker = new Worker("worker.js", { type: "module" });

            register_plugin = function (importObject) {
                importObject.env.reset_game = function(config) {
                    // console.log("Reset: " + config);
                    computer_move = null;
                    worker.postMessage({reset: config});
                };
                importObject.env.human_move = function(jso) {
                    let move = consume_js_object(jso);
                    // console.log("Human move: " + move);
                    worker.postMessage({move: move});
                };
                importObject.env.computer_move = function() {
                    let tmp = computer_move;
                    if (tmp !== null) {
                        computer_move = null;
                        // console.log("Computer move: " + tmp);
                        return js_object(tmp);
                    }
                    return -1;
                };
                importObject.env.open_link = function(jso) {
                    let link = consume_js_object(jso);
                    window.open(link, "_blank");
                };
                importObject.env.set_skill = function(jso) {
                    let skill = consume_js_object(jso);
                    worker.postMessage({skill: skill});
                };
            };

            miniquad_add_plugin({register_plugin});
        } else {
            alert("Your browser does not support this game");
        }
    </script>
    <!-- Minified and statically hosted version of https://github.com/not-fl3/macroquad/blob/master/js/mq_js_bundle.js -->
    <script src="mq_js_bundle.js"></script>
    <script>
        worker.onmessage = (e) => {
            // console.log("Worker sent: " + JSON.stringify(e.data));
            if ("ready" in e.data) {
                load("halt-frontend.wasm");
            } else if ("move" in e.data) {
                computer_move = e.data.move;
            }
        };
    </script>
</body>
</html>

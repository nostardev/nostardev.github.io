<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e22ea0f0-d865-4d30-beca-50fbbb0e03e0"></script>
    <title>Halt</title>
    <style>
        html,
        body,
        canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
        }
        #stats {
            width: 75%;
            background-color: black;
            text-align: center;
            color: gold;
        }
        #stats table {
            width: 80%;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex='1'></canvas>
    <div popover="auto" id="stats">stats go here!</div>
    <script src="gl.js"></script>
    <script src="sapp_jsutils.js"></script>
    <script>
        var worker;
        var computer_move = null;

        if (window.Worker) {
            worker = new Worker("worker.js", { type: "module" });

            register_plugin = function (importObject) {
                importObject.env.reset_game = function(config) {
                    // console.log("Reset: " + config);
                    computer_move = null;
                    worker.postMessage({reset: config});
                };
                importObject.env.human_move = function(jso) {
                    let move = consume_js_object(jso);
                    // console.log("Human move: " + move);
                    worker.postMessage({move: move});
                };
                importObject.env.computer_move = function() {
                    let tmp = computer_move;
                    if (tmp !== null) {
                        computer_move = null;
                        // console.log("Computer move: " + tmp);
                        return js_object(tmp);
                    }
                    return -1;
                };
                importObject.env.open_link = function(jso) {
                    let link = consume_js_object(jso);
                    window.open(link, "_blank");
                };
                importObject.env.get_storage = function(ko) {
                    let key = consume_js_object(ko);
                    let val = localStorage.getItem(key);
                    if (val !== null) {
                        return js_object(val);
                    }
                    return -1;
                };
                importObject.env.set_storage = function(ko, vo) {
                    let key = consume_js_object(ko);
                    let val = consume_js_object(vo);
                    localStorage.setItem(key, val);
                };
                importObject.env.show_stats = function() {
                    display_stats();
                };
            };

            miniquad_add_plugin({register_plugin});
        } else {
            alert("Your browser does not support this game");
        }

        function display_stats() {
            const stats = document.getElementById("stats");
            let content = "<table><tr><th>Level</th><th>Attempts</th></tr>";
            for (let i = 0; i < 10; ++i) {
                let j = localStorage.getItem(i);
                if (j === null) {
                    break;
                }
                let s = JSON.parse(j);
                let a = s.attempts;
                content += `<tr><td>${i + 1}</td><td>${a}</td></tr>`;
            }
            content += "</table>";
            stats.innerHTML = content;
            stats.showPopover();
        }
    </script>
    <!-- Minified and statically hosted version of https://github.com/not-fl3/macroquad/blob/master/js/mq_js_bundle.js -->
    <script src="mq_js_bundle.js"></script>
    <script>
        worker.onmessage = (e) => {
            // console.log("Worker sent: " + JSON.stringify(e.data));
            if ("ready" in e.data) {
                load("halt-frontend.wasm");
            } else if ("move" in e.data) {
                computer_move = e.data.move;
            }
        };
    </script>
</body>
</html>
